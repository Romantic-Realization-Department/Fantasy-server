name: fantasy stage CI Workflow

on:
  pull_request:
    branches:
      - 'develop'
  push:
    branches:
      - 'develop'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: Fantasy-server/Fantasy-server.sln
  DOTNET_VERSION: 10.0.x

jobs:
  validate-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Validate PR Title
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const releasePattern = /^release\/\d+\.\d+\.\d+$/;
            if (releasePattern.test(title)) {
              return;
            }

            const titlePattern = /^(feat|fix|update|docs|refactor|test|chore):\s+.+$/;
            if (!titlePattern.test(title)) {
              core.setFailed('Invalid title format. Use "{type}: {Korean description}" or release/x.x.x. Allowed types: feat, fix, update, docs, refactor, test, chore');
              return;
            }

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      projects-list: ${{ steps.build-matrix.outputs.projects-list }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Detect Changed Projects
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fantasy-server:
              - 'Fantasy-server/**'
              - '.github/workflows/fantasy-stage-ci.yml'

      - name: Build Project Matrix
        id: build-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX='{"include":[{"project":"fantasy-server","lang":"dotnet"}]}'
            PROJECTS="fantasy-server"
          elif [ "${{ steps.filter.outputs.fantasy-server }}" = "true" ]; then
            MATRIX='{"include":[{"project":"fantasy-server","lang":"dotnet"}]}'
            PROJECTS="fantasy-server"
          else
            MATRIX='{"include":[{"project":"변경 없음","lang":"skip"}]}'
            PROJECTS="없음"
          fi

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "projects-list=${PROJECTS}" >> "$GITHUB_OUTPUT"

  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-title, detect-changes]
    if: always() && (needs.validate-title.result == 'success' || needs.validate-title.result == 'skipped')
    name: build (${{ matrix.project }})

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: No Changed Projects
        if: matrix.lang == 'skip'
        run: echo "변경된 프로젝트가 없습니다."

      - name: Checkout Code
        if: matrix.lang != 'skip'
        uses: actions/checkout@v6

      - name: Setup .NET
        if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        if: matrix.lang == 'dotnet'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        if: matrix.lang == 'dotnet'
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Run Tests
        if: matrix.lang == 'dotnet'
        run: |
          dotnet test ${{ env.SOLUTION }} \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test_results.trx" \
            --verbosity minimal

      - name: Build Solution
        if: matrix.lang == 'dotnet'
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Upload Test Results
        if: always() && matrix.lang == 'dotnet'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-stage
          path: ./TestResults

  notify:
    runs-on: ubuntu-latest
    needs: [validate-title, detect-changes, build-and-test]
    if: always()
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.validate-title.result }}" == "failure" ]] || \
             [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "color=0xFF4C4C" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build-and-test.result }}" == "success" ]] || \
               [[ "${{ needs.build-and-test.result }}" == "skipped" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "color=0x4CAF50" >> "$GITHUB_OUTPUT"
          else
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
            echo "color=0xFFA500" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord Notification
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "Fantasy Server Stage CI"
          description: |
            `${{ github.ref_name }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Changed:** ${{ needs.detect-changes.outputs.projects-list }}
            ─────────────────────────────
            **Validate Title:** ${{ needs.validate-title.result }}
            **Build & Test:** ${{ needs.build-and-test.result }}
