name: fantasy prod CD Workflow

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // ""')

          if [[ "$PR_TITLE" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="v${BASH_REMATCH[1]}"
          else
            echo "::error::Release PR title must follow release/x.x.x. Current title: ${PR_TITLE:-unknown}"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $VERSION"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Tag
        run: git tag ${{ steps.version.outputs.version }}

      - name: Push Tag
        run: git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes $'## 수정내역\n\n- '

  deploy:
    runs-on: ubuntu-latest
    needs: release
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/fantasy-server
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ${IMAGE}:latest \
            -t ${IMAGE}:${VERSION} \
            -f Fantasy-server/Fantasy.Server/deploy/prod.dockerfile \
            Fantasy-server

      - name: Push Docker Image
        run: |
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${VERSION}

      - name: Copy Deploy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "Fantasy-server/Fantasy.Server/deploy/compose.prod.yaml,Fantasy-server/Fantasy.Server/deploy/docker/postgres/init.sh"
          target: "~/deploy/"
          strip_components: 3

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/deploy

            printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nDOCKER_USERNAME=%s\nDB_CONNECTION_STRING=%s\nREDIS_CONNECTION_STRING=%s\nJWT_SECRET_KEY=%s\n' \
              "${{ secrets.POSTGRES_USER }}" \
              "${{ secrets.POSTGRES_PASSWORD }}" \
              "${{ secrets.DOCKER_USERNAME }}" \
              "${{ secrets.DB_CONNECTION_STRING }}" \
              "${{ secrets.REDIS_CONNECTION_STRING }}" \
              "${{ secrets.JWT_SECRET_KEY }}" \
              > ~/deploy/.env
            chmod 600 ~/deploy/.env

            docker compose -f ~/deploy/compose.prod.yaml --env-file ~/deploy/.env pull
            docker compose -f ~/deploy/compose.prod.yaml --env-file ~/deploy/.env up -d

            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' fantasy-server 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "fantasy-server did not become healthy in time (status: $STATUS)"
                docker logs fantasy-server --tail 50
                exit 1
              fi
              sleep 3
            done

            echo "fantasy-server is healthy"
            docker logs fantasy-server --tail 20
            docker image prune -f

  notify:
    runs-on: ubuntu-latest
    needs: [release, deploy]
    if: always()
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}

    steps:
      - name: Send Discord Notification
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "Fantasy Server Prod CD"
          description: |
            Released `${{ needs.release.outputs.version }}` · by **${{ github.actor }}**
            **Release:** ${{ needs.release.result }}
            **Deploy:** ${{ needs.deploy.result }}
